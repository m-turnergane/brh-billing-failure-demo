name: Verify public demo
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Browser verification
        run: |
          npm start > /tmp/brh-demo.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:43128/demo > /dev/null && break; sleep 1; done
          npm run test:browser
